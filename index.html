<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Acompanhe suas contas mensais e pagamentos, mês a mês.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Contas do mês</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172a27;background:#dce5e0;font-synthesis:none;text-rendering:optimizeLegibility;--green:#0b6861;--green-dark:#064c49;--mint:#e4f2e9;--line:#d9e4dd;--muted:#71817a;--red:#b24d46}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#dce5e0}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent} .app{width:min(100%,560px);min-height:100vh;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));background:#eff4f0}
    header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 24px}.brand{display:flex;align-items:center;gap:11px}.brand-icon{width:42px;height:42px;display:grid;place-items:center;background:#e4efe7;border-radius:14px;color:var(--green)}.brand-icon svg{width:23px;height:23px}.brand-name{font-size:17px;font-weight:750;letter-spacing:-.35px}.brand-caption{font-size:12px;color:var(--muted);margin-top:2px}.month-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px 18px 17px;box-shadow:0 5px 20px #15251a08}.month-top{display:flex;align-items:center;justify-content:space-between}.month-label{font-size:11px;font-weight:700;letter-spacing:1.15px;color:var(--muted);text-transform:uppercase}.month-nav{display:flex;gap:8px}.icon-btn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:#fff;color:#39443e;display:grid;place-items:center}.icon-btn:active{background:#eef2ee}.icon-btn svg{width:18px;height:18px}.month-title{font-size:27px;letter-spacing:-1px;margin:8px 0 18px;font-weight:750;text-transform:capitalize}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:15px}.stat{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}.stat:first-child{padding-left:0;border:0}.stat-num{font-size:20px;font-weight:750;line-height:1}.stat-name{font-size:11px;color:var(--muted);margin-top:4px}.stat-dot{width:8px;height:8px;border-radius:50%;background:#9ba69f}.stat.paid .stat-dot{background:#2f9b68}.stat.pending .stat-dot{background:#e4a542}.section-heading{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 12px}.section-heading h2{font-size:15px;margin:0;font-weight:730}.count-badge{font-size:11px;font-weight:700;color:#65716a;background:#e9ede9;border-radius:20px;padding:5px 9px}.bill-list{display:grid;gap:10px}.bill{display:flex;align-items:center;gap:13px;padding:14px 13px;background:#fff;border:1px solid var(--line);border-radius:17px;min-height:77px;transition:background .16s,border-color .16s}.bill.is-paid{background:#f1f8f3;border-color:#d5e8db}.check{width:44px;height:44px;flex:0 0 44px;border:1.5px solid #d3dad4;border-radius:14px;background:#fff;display:grid;place-items:center;color:transparent}.check svg{width:20px;height:20px}.is-paid .check{background:var(--green);border-color:var(--green);color:#fff}.bill-info{min-width:0;flex:1}.bill-name{font-size:15px;font-weight:690;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bill-meta{font-size:12px;color:var(--muted);margin-top:5px}.is-paid .bill-meta{color:#47775a}.bill-side{display:flex;align-items:center;gap:3px}.edit-date{appearance:none;border:0;background:transparent;color:#65716a;font-size:12px;font-weight:600;padding:9px 4px;max-width:113px}.edit-date:disabled{color:#929b95}.edit-date::-webkit-calendar-picker-indicator{opacity:.7}.actions{display:flex;gap:1px}.small-action{border:0;background:transparent;color:#7a847e;width:34px;height:38px;display:grid;place-items:center;border-radius:10px}.small-action:active{background:#eef1ee}.small-action svg{width:17px;height:17px}.small-action.delete:hover{color:var(--red)}.add-button{width:100%;min-height:54px;border:1.5px dashed #9bb7a4;border-radius:16px;color:var(--green-dark);background:#eff6f0;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:13px}.add-button svg{width:18px;height:18px}.empty{background:#fff;border:1px dashed #d9e1da;border-radius:18px;text-align:center;padding:28px 20px;color:var(--muted);font-size:13px;line-height:1.55}.empty strong{display:block;color:#39443e;font-size:15px;margin-bottom:5px}.privacy{display:flex;justify-content:center;gap:6px;align-items:center;color:#8a948d;font-size:11px;margin:20px 0 0}.privacy svg{width:13px;height:13px}
    dialog{border:0;border-radius:22px;padding:0;width:min(calc(100% - 32px),420px);box-shadow:0 24px 90px #0b21164d;color:#202925}dialog::backdrop{background:#16231db0;backdrop-filter:blur(3px)}.form{padding:23px}.form h2{font-size:20px;letter-spacing:-.4px;margin:0 0 6px}.form p{font-size:13px;color:var(--muted);margin:0 0 20px}.field-label{font-size:12px;font-weight:700;display:block;margin:0 0 7px}.text-input{width:100%;height:50px;border:1px solid #dce3dd;border-radius:13px;padding:0 13px;font-size:16px;outline:none}.text-input:focus{border-color:var(--green);box-shadow:0 0 0 3px #2874511c}.form-actions{display:flex;gap:10px;margin-top:20px}.form-actions button{min-height:48px;border-radius:13px;font-weight:700;flex:1}.cancel{border:1px solid var(--line);background:white;color:#56615a}.save{border:0;background:var(--green);color:white}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#26352d;color:white;padding:11px 16px;border-radius:13px;font-size:13px;box-shadow:0 8px 25px #10211740;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .install-button{width:100%;min-height:50px;border:0;border-radius:15px;background:var(--green);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 14px;box-shadow:0 5px 14px #28745128}.install-button svg{width:19px;height:19px}.install-button[hidden]{display:none}
    .stat-filter{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;flex:1;min-width:0;border:0;background:transparent;border-radius:12px;padding:6px 4px;transition:background .15s,box-shadow .15s}.stat-filter>span:last-child{display:block}.stat-filter .stat-num,.stat-filter .stat-name{display:block}.stat-filter:focus-visible{outline:2px solid #d9f04e;outline-offset:2px}.stat-filter[aria-pressed="true"]{background:#ffffff20;box-shadow:inset 0 0 0 1px #ffffff50}
    header{background:#fff;margin:calc(-18px - env(safe-area-inset-top)) -18px 20px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;border-bottom:1px solid #d8e2dc}.brand-icon{background:#0a625d;color:#fff}.month-card{background:linear-gradient(135deg,#0d6d68 0%,#138079 100%);border-color:#13766f;box-shadow:0 10px 24px #0d6d6824}.month-label,.month-card .stat-name{color:#c0d7d1}.month-title,.month-card .stat-num{color:#fff}.month-card .stats{border-top-color:#ffffff3d}.month-card .stat{border-left-color:#ffffff3d}.month-card .stat-dot{background:#c2d5d0}.month-card .stat.paid .stat-dot{background:#d8f34f}.month-card .stat.pending .stat-dot{background:#f0a52b}.month-card .icon-btn{background:#ffffff19;border-color:#ffffff4a;color:#fff}.month-card .icon-btn:active{background:#ffffff30}.count-badge{background:#dcebe3;color:#315d4e}.bill.is-paid{background:#e6f3e9;border-color:#cde4d4}.is-paid .bill-meta{color:#247350}.check{border-color:#d2dfd6}.is-paid .check{background:#0b6861;border-color:#0b6861}.add-button{color:#064c49;background:#d9f04e;border-color:#cde33e}.install-button{background:#d9f04e;color:#064c49;box-shadow:0 5px 14px #a6be252b}.save{background:#0b6861}.toast{background:#064946}
    @media(max-width:390px){.app{padding-left:14px;padding-right:14px}.month-card{padding:17px 15px}.bill{gap:10px;padding:12px 9px}.check{width:42px;height:42px;flex-basis:42px}.small-action{width:29px}.edit-date{font-size:11px;max-width:99px}.bill-name{font-size:14px}}
    @media(min-width:600px){.app{padding-top:34px}.month-card{padding:23px}header{margin-top:calc(-34px - env(safe-area-inset-top))}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 10h16m-11 5 2 2 4-4"/></svg></div><div><div class="brand-name">Contas do mês</div><div class="brand-caption">Seu mês em dia, sem complicação</div></div></div></header>
    <button class="install-button" id="installButton" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>Instalar no celular</button>
    <section class="month-card" aria-label="Resumo do mês"><div class="month-top"><span class="month-label">Resumo mensal</span><div class="month-nav"><button id="prevMonth" class="icon-btn" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><button id="nextMonth" class="icon-btn" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button></div></div><h1 class="month-title" id="monthTitle"></h1><div class="stats"><button type="button" class="stat stat-filter" data-filter="all" aria-label="Mostrar todas as contas" aria-pressed="true"><span class="stat-dot"></span><span><span class="stat-num" id="totalCount">0</span><span class="stat-name">contas</span></span></button><button type="button" class="stat paid stat-filter" data-filter="paid" aria-label="Mostrar contas pagas" aria-pressed="false"><span class="stat-dot"></span><span><span class="stat-num" id="paidCount">0</span><span class="stat-name">pagas</span></span></button><button type="button" class="stat pending stat-filter" data-filter="pending" aria-label="Mostrar contas pendentes" aria-pressed="false"><span class="stat-dot"></span><span><span class="stat-num" id="pendingCount">0</span><span class="stat-name">pendentes</span></span></button></div></section>
    <div class="section-heading"><h2 id="listHeading">Suas contas</h2><span class="count-badge" id="listCount">0 contas</span></div>
    <section class="bill-list" id="billList" aria-live="polite"></section>
    <button class="add-button" id="addButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Adicionar conta</button>
    <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Seus dados ficam salvos neste aparelho</div>
  </main>
  <dialog id="billDialog"><form class="form" id="billForm"><h2 id="dialogTitle">Nova conta</h2><p>Ela aparecerá automaticamente em todos os meses.</p><label class="field-label" for="billName">Nome da conta</label><input id="billName" class="text-input" maxlength="48" placeholder="Ex.: Água" required autocomplete="off"><input id="billId" type="hidden"><div class="form-actions"><button type="button" class="cancel" id="cancelDialog">Cancelar</button><button type="submit" class="save">Salvar conta</button></div></form></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    (()=>{
      const KEY='contas-do-mes-v1';
      const monthNames=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
      const icons={edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg>',delete:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>'};
      const today=new Date();let current=new Date(today.getFullYear(),today.getMonth(),1);let data=load();let toastTimer;let activeFilter='all';
      function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY));if(parsed&&Array.isArray(parsed.expenses)&&parsed.payments&&typeof parsed.payments==='object')return parsed}catch(e){}return{expenses:[],payments:{}}}
      function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){showToast('Não foi possível salvar neste aparelho.');}}
      function monthKey(date=current){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`}
      function dateToday(){return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`}
      function formatDate(value){if(!value)return '';const [y,m,d]=value.split('-');return `${d}/${m}/${y}`}
      function render(){const key=monthKey();document.querySelector('#monthTitle').textContent=`${monthNames[current.getMonth()]}/${current.getFullYear()}`;const paid=data.expenses.filter(e=>data.payments[key]?.[e.id]?.paid).length;const pending=data.expenses.length-paid;document.querySelector('#totalCount').textContent=data.expenses.length;document.querySelector('#paidCount').textContent=paid;document.querySelector('#pendingCount').textContent=pending;document.querySelectorAll('.stat-filter').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.filter===activeFilter)));const names={all:'Suas contas',paid:'Contas pagas',pending:'Contas pendentes'};document.querySelector('#listHeading').textContent=names[activeFilter];const filtered=data.expenses.filter(expense=>activeFilter==='all'||!!data.payments[key]?.[expense.id]?.paid===(activeFilter==='paid'));document.querySelector('#listCount').textContent=`${filtered.length} ${filtered.length===1?'conta':'contas'}`;const list=document.querySelector('#billList');list.replaceChildren();if(!data.expenses.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<strong>Nenhuma conta por aqui</strong>Adicione sua primeira conta e acompanhe os pagamentos mês a mês.';list.append(empty);return}if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML=`<strong>Nenhuma conta ${activeFilter==='paid'?'paga':'pendente'}</strong>Toque em “Contas” no resumo para ver todas.`;list.append(empty);return}filtered.forEach(expense=>{const payment=data.payments[key]?.[expense.id]||{paid:false,date:''};const card=document.createElement('article');card.className=`bill${payment.paid?' is-paid':''}`;const check=document.createElement('button');check.className='check';check.type='button';check.setAttribute('aria-label',payment.paid?'Marcar como pendente':'Marcar como paga');check.setAttribute('aria-pressed',String(!!payment.paid));check.innerHTML=icons.check;check.addEventListener('click',()=>togglePaid(expense.id));const info=document.createElement('div');info.className='bill-info';const name=document.createElement('div');name.className='bill-name';name.textContent=expense.name;const meta=document.createElement('div');meta.className='bill-meta';meta.textContent=payment.paid?'Paga':'Pendente';info.append(name,meta);const side=document.createElement('div');side.className='bill-side';const date=document.createElement('input');date.type='date';date.className='edit-date';date.value=payment.date||'';date.disabled=!payment.paid;date.setAttribute('aria-label',`Data de pagamento de ${expense.name}`);date.title=payment.paid?'Editar data do pagamento':'Marque como paga para informar a data';date.addEventListener('change',()=>setDate(expense.id,date.value));side.append(date);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.type='button';edit.className='small-action';edit.setAttribute('aria-label',`Editar ${expense.name}`);edit.innerHTML=icons.edit;edit.addEventListener('click',()=>openDialog(expense));const del=document.createElement('button');del.type='button';del.className='small-action delete';del.setAttribute('aria-label',`Excluir ${expense.name}`);del.innerHTML=icons.delete;del.addEventListener('click',()=>removeExpense(expense.id));actions.append(edit,del);side.append(actions);card.append(check,info,side);list.append(card)})}
      function togglePaid(id){const key=monthKey();data.payments[key]??={};const entry=data.payments[key][id]||{paid:false,date:''};data.payments[key][id]=entry.paid?{paid:false,date:''}:{paid:true,date:dateToday()};persist();render()}
      function setDate(id,date){const key=monthKey();data.payments[key]??={};data.payments[key][id]??={paid:true,date:dateToday()};data.payments[key][id].date=date;persist();render();showToast('Data do pagamento atualizada')}
      function removeExpense(id){const expense=data.expenses.find(e=>e.id===id);if(!expense||!confirm(`Excluir “${expense.name}” de todos os meses?`))return;data.expenses=data.expenses.filter(e=>e.id!==id);for(const payments of Object.values(data.payments))delete payments[id];persist();render();showToast('Conta excluída')}
      const dialog=document.querySelector('#billDialog');function openDialog(expense=null){document.querySelector('#billForm').reset();document.querySelector('#billId').value=expense?.id||'';document.querySelector('#dialogTitle').textContent=expense?'Editar conta':'Nova conta';document.querySelector('#billName').value=expense?.name||'';dialog.showModal();setTimeout(()=>document.querySelector('#billName').focus(),50)}
      document.querySelector('#billForm').addEventListener('submit',event=>{event.preventDefault();const name=document.querySelector('#billName').value.trim();if(!name)return;const id=document.querySelector('#billId').value;if(id){const item=data.expenses.find(e=>e.id===id);if(item)item.name=name;showToast('Conta atualizada')}else{data.expenses.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,name});showToast('Conta adicionada')}persist();dialog.close();render()});document.querySelector('#cancelDialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});document.querySelector('#addButton').addEventListener('click',()=>openDialog());document.querySelector('#prevMonth').addEventListener('click',()=>{current=new Date(current.getFullYear(),current.getMonth()-1,1);render()});document.querySelector('#nextMonth').addEventListener('click',()=>{current=new Date(current.getFullYear(),current.getMonth()+1,1);render()});
      function showToast(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
      document.querySelectorAll('.stat-filter').forEach(button=>button.addEventListener('click',()=>{activeFilter=activeFilter===button.dataset.filter?'all':button.dataset.filter;render();document.querySelector('#listHeading').scrollIntoView({behavior:'smooth',block:'start'})}));
      render();
      let installPrompt=null;const installButton=document.querySelector('#installButton');
      window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installButton.hidden=false});
      installButton.addEventListener('click',async()=>{if(!installPrompt)return;await installPrompt.prompt();const result=await installPrompt.userChoice;if(result.outcome==='accepted')installButton.hidden=true;installPrompt=null});
      window.addEventListener('appinstalled',()=>{installPrompt=null;installButton.hidden=true;showToast('App instalado no aparelho')});
      if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    })();
  </script>
</body>
</html>
